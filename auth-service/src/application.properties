server.port=8081
spring.application.name=auth-service

# Local default. run-auth.ps1 sets SPRING_DATA_MONGODB_URI from auth-service/.env when present.
spring.data.mongodb.uri=mongodb://localhost:27017/auth_db

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

spring.mail.host=smtp.gmail.com
# 465 = SMTPS (implicit SSL). Confirmed open on your network.
spring.mail.port=${GMAIL_SMTP_PORT:465}
spring.mail.username=${GMAIL_USERNAME:}
spring.mail.password=${GMAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.socketFactory.port=${GMAIL_SMTP_PORT:465}
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
spring.mail.properties.mail.smtp.socketFactory.fallback=false
spring.mail.properties.mail.smtp.connectiontimeout=15000
spring.mail.properties.mail.smtp.timeout=15000

verification.strategy=${VERIFICATION_STRATEGY:otp}
verification.base-url=${VERIFICATION_BASE_URL:http://localhost:8081/api/auth/verify/link}
